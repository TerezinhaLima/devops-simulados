<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulados DevOps Professional</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>📘 Simulados DevOps Professional</h1>
    <p class="subtitle">Estude com questões comentadas dos 4 simulados</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-sim="1">Simulado 1</button>
    <button class="tab" data-sim="2">Simulado 2</button>
    <button class="tab" data-sim="3">Simulado 3</button>
    <button class="tab" data-sim="4">Simulado 4</button>
    <button class="tab" data-view="stats">📊 Estatísticas</button>
  </nav>

  <main>
    <div id="quiz-container"></div>
    <aside id="sidebar">
      <h3>Navegação</h3>
      <div id="question-grid"></div>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
